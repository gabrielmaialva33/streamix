<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <title>Offline · Streamix</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #141414;
        --border: #2a2a2a;
        --text: #f5f5f5;
        --muted: #b3b3b3;
        --brand: #e50914;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding:
          max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 420px);
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      img {
        display: block;
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        border-radius: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      form {
        margin: 0;
      }

      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        background: var(--brand);
        color: white;
        font: inherit;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/apple-touch-icon.png" alt="" />
      <h1>Você está offline</h1>
      <p>
        O Streamix manteve o app aberto, mas essa tela precisa de conexão para carregar dados novos.
      </p>
      <form action="/" method="get">
        <button type="submit">Tentar novamente</button>
      </form>
    </main>
  </body>
</html>
