# Stream Proxy for Streamix IPTV (source.mahina.cloud / source2.mahina.cloud)
#
# Goal: behave like the BEAM proxy did — one effective upstream connection
# per movie, not one per byte-range. Achieved with `proxy_cache` + slice
# module (chunks the file in 1 MB blocks, caches each block once, serves
# subsequent range requests from disk) and `proxy_cache_lock` (single-flight
# coalescing for concurrent viewers hitting the same chunk).
#
# Install:
#   /etc/nginx/sites-available/stream-proxy
#   ln -s ... /etc/nginx/sites-enabled/
#   mkdir -p /var/cache/nginx/iptv && chown www-data:www-data /var/cache/nginx/iptv
#   nginx -t && systemctl reload nginx

# 50 MB key zone holds metadata for ~400k cached slices.
# 30 GB on-disk cache fits ~30 movies fully cached at typical bitrates,
# or many more partial caches (only the popular regions stay hot).
proxy_cache_path /var/cache/nginx/iptv
                 levels=1:2
                 keys_zone=iptv:50m
                 max_size=30g
                 inactive=6h
                 use_temp_path=off;

# Upstream connection reuse — keepalive is per-worker, so each worker
# keeps a small pool of warm TLS connections to choki. Cuts vauth chain
# traversals dramatically for the (rare) cache MISS path.
upstream choki_pool {
    # Real host is set dynamically via $target_url; this placeholder lets
    # us declare keepalive params. We rely on resolver + proxy_pass.
    server 127.0.0.1:443; # never actually hit — proxy_pass overrides.
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 8081;
    server_name source.mahina.cloud source2.mahina.cloud;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Health endpoint — no caching, no upstream
    location = /health {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Content-Type' 'application/json' always;
        return 200 '{"status":"ok"}';
    }

    location = /proxy {
        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Accept-Encoding, Content-Type, Origin, Accept' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            return 204;
        }

        set $target_url $arg_url;

        # ====== Cache config (the actual win) ======
        # Slice the file into 1 MB blocks aligned on slice boundaries.
        # Each slice is a separate cache object keyed by URL + slice range.
        # Key is `$args + $slice_range` — `$args` carries `url=...` with
        # the *original* USER/PASS path (stable per stream), so different
        # client sessions hit the same cache slice. We deliberately do not
        # mix `$proxy_host` into the key: when the upstream redirects us
        # to a per-session vauth host, we still want cross-session reuse
        # for the same content.
        slice 1m;
        proxy_cache iptv;
        proxy_cache_key "$args$slice_range";
        proxy_cache_valid 200 206 6h;
        proxy_cache_valid 301 302 1m;
        proxy_cache_valid 404 1m;

        # Single-flight: N concurrent viewers requesting the same slice
        # send 1 request upstream; the rest stream from the in-flight
        # response as soon as headers arrive.
        proxy_cache_lock on;
        proxy_cache_lock_age 30s;
        proxy_cache_lock_timeout 30s;

        # When upstream is angry (504 from choki), serve whatever stale
        # we have and refresh in background. The user keeps watching.
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504 http_429;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;

        # Make upstream see one slice at a time; cache works on slices.
        proxy_set_header Range $slice_range;
        proxy_force_ranges on;

        # Buffering MUST be on for proxy_cache to work. The cost is
        # ~few hundred KB of RAM per active worker — trivial.
        proxy_buffering on;
        proxy_buffers 32 128k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;

        # ====== Upstream tuning ======
        proxy_pass $target_url;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # required for keepalive
        proxy_set_header Host $proxy_host;
        proxy_set_header User-Agent "XCIPTV/1.0";
        proxy_set_header Accept "*/*";

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 30s;
        proxy_next_upstream_tries 3;

        # ====== CORS (single value only) ======
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';
        proxy_hide_header 'Access-Control-Max-Age';
        proxy_hide_header 'Cache-Control';   # upstream "no-store" would block us caching

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Accept-Encoding, Content-Type' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges, Content-Type' always;
        add_header 'Accept-Ranges' 'bytes' always;
        # Diagnostics — visible in DevTools network tab.
        add_header 'X-Cache-Status' $upstream_cache_status always;
        add_header 'X-Slice-Range' $slice_range always;

        proxy_pass_header Content-Range;
        proxy_pass_header Accept-Ranges;

        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 301 302 303 307 308 = @handle_redirect;
    }

    location @handle_redirect {
        set $redirect_url $upstream_http_location;

        # Same cache + slice config on the redirect target so the chain
        # resolution doesn't blow up our cache strategy.
        slice 1m;
        proxy_cache iptv;
        # Same key as in /proxy: stable across vauth host rotations.
        proxy_cache_key "$args$slice_range";
        proxy_cache_valid 200 206 6h;
        proxy_cache_lock on;
        proxy_cache_lock_age 30s;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504 http_429;
        proxy_cache_background_update on;

        proxy_set_header Range $slice_range;
        proxy_force_ranges on;
        proxy_buffering on;
        proxy_buffers 32 128k;
        proxy_buffer_size 128k;

        proxy_pass $redirect_url;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header User-Agent "XCIPTV/1.0";
        proxy_set_header Accept "*/*";

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';
        proxy_hide_header 'Cache-Control';

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
        add_header 'Accept-Ranges' 'bytes' always;
        add_header 'X-Cache-Status' $upstream_cache_status always;
    }
}
