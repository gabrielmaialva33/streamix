name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "27.3"
  ADMIN_PASSWORD: ci-test-admin-123
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/streamix_test
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    name: ExUnit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: streamix_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - run: echo "PROVIDER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - uses: erlef/setup-beam@v1
        with: {elixir-version: "${{ env.ELIXIR_VERSION }}", otp-version: "${{ env.OTP_VERSION }}"}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --max-failures 3

  playwright:
    name: Playwright / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: streamix_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      PW_TRACE: "true"
    steps:
      - uses: actions/checkout@v4
      - run: echo "PROVIDER_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - uses: erlef/setup-beam@v1
        with: {elixir-version: "${{ env.ELIXIR_VERSION }}", otp-version: "${{ env.OTP_VERSION }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: assets/package-lock.json}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('assets/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - run: mix deps.get
      - working-directory: assets
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: mix test --include playwright --only playwright --max-failures 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-artifacts
          path: |
            tmp/playwright/
            _build/test/playwright/
          if-no-files-found: ignore
