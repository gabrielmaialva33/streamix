name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ELIXIR_VERSION: 1.20.3
  OTP_VERSION: 29.0.5
  NODE_VERSION: 26.7.0
  NPM_VERSION: 12.0.2
  TRIVY_VERSION: 0.73.0
  TRIVY_LINUX_AMD64_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: backend-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: timescale/timescaledb:2.29.1-pg17@sha256:981e3016a2810fec47515e3828ad70ae97b84f4c9ef63d032180b54f61566fd6
        env:
          POSTGRES_USER: streamix
          POSTGRES_PASSWORD: streamix
          POSTGRES_DB: streamix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamix -d streamix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      TEST_DATABASE_URL: ecto://streamix:streamix@localhost:5432/streamix_test
      REDIS_URL: redis://localhost:6379
      RABBITMQ_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: beam-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            beam-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache compiled application
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/test
          key: beam-build-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('lib/**/*.ex', 'config/*.exs', 'mix.exs') }}
          restore-keys: |
            beam-build-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-

      - name: Install dependencies
        run: mix deps.get --only test

      - name: Static analysis and security
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/check-runtime-versions.sh
          bash scripts/check-migration-safety.sh
          bash scripts/check-production-compose.sh
          mix deps.unlock --check-unused
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix credo --strict
          mix sobelow
          mix deps.audit
          mix hex.audit

      - name: Test
        run: |
          mix test --cover
          mix test --only slow

      - name: Assemble production release
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          mix release --overwrite --path "${RUNNER_TEMP}/streamix-release"

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dialyzer-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      - name: Cache dependencies and PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
            priv/plts
          key: dialyzer-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            dialyzer-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check contracts
        run: mix dialyzer

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: frontend-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: assets

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint -- --error-on-warnings

      - name: Unit tests
        run: npm test

  e2e:
    name: Player E2E / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    concurrency:
      group: e2e-${{ matrix.browser }}-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: timescale/timescaledb:2.29.1-pg17@sha256:981e3016a2810fec47515e3828ad70ae97b84f4c9ef63d032180b54f61566fd6
        env:
          POSTGRES_USER: streamix
          POSTGRES_PASSWORD: streamix
          POSTGRES_DB: streamix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamix -d streamix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      TEST_DATABASE_URL: ecto://streamix:streamix@localhost:5432/streamix_test
      REDIS_URL: redis://localhost:6379
      RABBITMQ_ENABLED: "false"
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: e2e-beam-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            e2e-beam-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Restore asset binaries
        id: asset-binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/tailwind-*
            _build/esbuild-*
          key: e2e-assets-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'config/config.exs') }}
          restore-keys: |
            e2e-assets-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: |
          mix deps.get --only test
          npm ci --prefix assets --no-audit --no-fund

      - name: Install ffmpeg for deterministic media fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install asset binaries
        run: bash scripts/install-asset-binaries.sh

      # Saved outside actions/cache so a failing test step still persists the
      # downloaded binaries; GitHub release downloads are the flakiest hop here.
      - name: Save asset binaries
        if: steps.asset-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/tailwind-*
            _build/esbuild-*
          key: ${{ steps.asset-binaries.outputs.cache-primary-key }}

      - name: Validate OpenAPI contract
        if: matrix.browser == 'chromium'
        run: |
          mix openapi.spec.json --spec StreamixWeb.Api.V1.OpenApi --start-app=false --vendor-extensions=false /tmp/streamix-openapi.json
          npm --prefix assets run lint:openapi -- /tmp/streamix-openapi.json

      - name: Run player browser gate (${{ matrix.browser }})
        run: bash scripts/test-playwright-docker.sh

      - name: Run MPEG-TS browser gate (${{ matrix.browser }})
        run: bash scripts/test-mpegts-browser-gate.sh

      - name: Run Chromium PWA installability smoke
        if: matrix.browser == 'chromium'
        run: bash scripts/test-pwa-chromium.sh

      - name: Enforce production asset budgets
        if: matrix.browser == 'chromium'
        run: npm --prefix assets run budget:assets

  build:
    name: Build candidate image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write # Push the candidate image and OCI attestations.
      id-token: write # Mint the short-lived certificate used to sign attestations.
      attestations: write # Create signed provenance and SBOM attestations.

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: mode=max
          sbom: true

      - name: Install verified Trivy binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_name="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          archive="${RUNNER_TEMP}/${archive_name}"
          install_dir="${RUNNER_TEMP}/trivy-bin"
          downloaded=false

          for attempt in 1 2 3; do
            if gh release download "v${TRIVY_VERSION}" \
              --repo aquasecurity/trivy \
              --pattern "${archive_name}" \
              --output "${archive}" \
              --clobber; then
              downloaded=true
              break
            fi

            if [ "${attempt}" -lt 3 ]; then
              backoff=$((attempt * 5))
              echo "Trivy download attempt ${attempt}/3 failed; retrying in ${backoff}s" >&2
              sleep "${backoff}"
            fi
          done

          if [ "${downloaded}" != true ]; then
            echo "Unable to download Trivy v${TRIVY_VERSION} after 3 attempts" >&2
            exit 1
          fi

          printf '%s  %s\n' "${TRIVY_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --status
          install -d "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" trivy
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/trivy" --version

      - name: Scan candidate image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output: streamix.spdx.json
          skip-setup-trivy: true

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: streamix.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify signed provenance before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          signer="${GITHUB_REPOSITORY}/.github/workflows/docker.yml"

          gh attestation verify "${image}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${signer}" \
            --bundle-from-oci

          gh attestation verify "${image}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${signer}" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --bundle-from-oci

  promote:
    name: Promote approved image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, dialyzer, frontend, e2e, build]
    concurrency:
      group: promote-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write # Move the approved digest to the latest tag.

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at approved digest
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, promote]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://streamix.mahina.fun

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy approved digest
        uses: ./.github/actions/deploy-production
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          image-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image-digest: ${{ needs.build.outputs.image_digest }}
          expected-revision: ${{ github.sha }}
          canary-email: ${{ secrets.DEPLOY_CANARY_EMAIL || secrets.ADMIN_EMAIL }}
          canary-password: ${{ secrets.DEPLOY_CANARY_PASSWORD || secrets.ADMIN_PASSWORD }}
