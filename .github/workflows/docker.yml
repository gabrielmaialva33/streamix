name: CI/CD

on:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on direct pushes to master. Being explicit here means a
    # future workflow edit can't accidentally ship a feature branch to prod.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Serialize deploys — if a second push lands mid-rollout we queue it
    # instead of racing two `docker compose up` against the same host.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Lets the repo tie protection rules / required reviewers to the env
    # without touching the workflow.
    environment:
      name: production
      url: https://streamix.mahina.cloud

    steps:
      - name: Pull new image & recreate container on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # script_stop makes the remote shell exit on the first failing
          # command — without it, a failed `pull` still marks the job green.
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/streamix

            echo "[deploy] sha=${{ needs.build.outputs.image_tag }}"
            echo "[deploy] pulling image..."
            docker compose pull streamix

            echo "[deploy] recreating container..."
            docker compose up -d --force-recreate --remove-orphans streamix

            echo "[deploy] waiting up to 90s for healthy status..."
            i=0
            while [ $i -lt 45 ]; do
              status=$(docker inspect -f '{{.State.Health.Status}}' streamix 2>/dev/null || true)
              if [ "$status" = "healthy" ]; then
                echo "[deploy] OK: streamix healthy"
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              if [ "$status" = "unhealthy" ]; then
                echo "[deploy] FAIL: streamix unhealthy, recent logs:"
                docker logs --tail 120 streamix
                exit 1
              fi
              i=$((i + 1))
              sleep 2
            done

            echo "[deploy] FAIL: streamix never became healthy, recent logs:"
            docker logs --tail 200 streamix
            exit 1
