name: Deploy production digest
description: Preflight SSH and deploy one immutable GHCR digest to production.

inputs:
  host:
    description: SSH host
    required: true
  username:
    description: SSH user
    required: true
  private-key:
    description: SSH private key
    required: true
  port:
    description: SSH port
    required: false
    default: "22"
  image-name:
    description: Fully qualified image name without a tag
    required: true
  image-digest:
    description: Immutable sha256 image digest
    required: true
  expected-revision:
    description: Git revision expected from the deployed health endpoint
    required: true
  base-url:
    description: Public production URL used by deployment canaries
    required: false
    default: https://streamix.mahina.fun
  canary-email:
    description: API account email used by the authenticated production canary
    required: true
  canary-password:
    description: API account password used by the authenticated production canary
    required: true

runs:
  using: composite
  steps:
    - name: Validate approved digest
      shell: bash
      env:
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        EXPECTED_REVISION: ${{ inputs.expected-revision }}
        DEPLOY_CANARY_EMAIL: ${{ inputs.canary-email }}
        DEPLOY_CANARY_PASSWORD: ${{ inputs.canary-password }}
      run: |
        if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::image-digest must be a sha256 digest"
          exit 2
        fi

        if [[ ! "${EXPECTED_REVISION}" =~ ^[0-9a-f]{40,64}$ ]]; then
          echo "::error::expected-revision must be a full Git revision"
          exit 2
        fi

        if [ -z "${DEPLOY_CANARY_EMAIL}" ] || [ -z "${DEPLOY_CANARY_PASSWORD}" ]; then
          echo "::error::authenticated production canary credentials are required"
          exit 2
        fi

    - name: Wait for SSH
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_PORT: ${{ inputs.port }}
      run: |
        for attempt in 1 2 3; do
          if timeout 5 bash -c "exec 3<>/dev/tcp/${SSH_HOST}/${SSH_PORT}"; then
            echo "[deploy] SSH reachable on attempt ${attempt}"
            exit 0
          fi

          if [ "${attempt}" -lt 3 ]; then
            backoff=$((attempt * 5))
            echo "[deploy] SSH unavailable, retrying in ${backoff}s"
            sleep "${backoff}"
          fi
        done

        echo "::error::SSH remained unreachable after 3 attempts"
        exit 1

    - name: Package versioned production compose
      id: compose
      shell: bash
      run: |
        compose_file="deploy/docker-compose.production.yml"
        bash scripts/check-production-compose.sh "${compose_file}"
        echo "payload=$(base64 --wrap=0 "${compose_file}")" >>"${GITHUB_OUTPUT}"
        echo "sha256=$(sha256sum "${compose_file}" | awk '{print $1}')" >>"${GITHUB_OUTPUT}"

    - name: Deploy approved digest
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        PRODUCTION_COMPOSE_B64: ${{ steps.compose.outputs.payload }}
        PRODUCTION_COMPOSE_SHA256: ${{ steps.compose.outputs.sha256 }}
        EXPECTED_REVISION: ${{ inputs.expected-revision }}
        DEPLOY_BASE_URL: ${{ inputs.base-url }}
        DEPLOY_CANARY_EMAIL: ${{ inputs.canary-email }}
        DEPLOY_CANARY_PASSWORD: ${{ inputs.canary-password }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key: ${{ inputs.private-key }}
        port: ${{ inputs.port }}
        timeout: 30s
        command_timeout: 8m
        envs: IMAGE_NAME,IMAGE_DIGEST,PRODUCTION_COMPOSE_B64,PRODUCTION_COMPOSE_SHA256,EXPECTED_REVISION,DEPLOY_BASE_URL,DEPLOY_CANARY_EMAIL,DEPLOY_CANARY_PASSWORD
        script_path: scripts/deploy-production.sh
